<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shator Canvas — 3D Art Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0a0a;font-family:Arial,Helvetica,sans-serif;}
  canvas{display:block;}
  #blocker{position:absolute;inset:0;background:rgba(10,10,10,0.85);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;z-index:20;}
  #instructions{max-width:440px;line-height:1.5;}
  #galleryLogo{max-width:340px;width:80%;height:auto;margin:0 0 14px;filter:drop-shadow(0 4px 20px rgba(212,175,122,0.25));}
  #gallerySubtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:#b8b0a0;letter-spacing:2px;margin:0 0 22px;}
  #instructions h2{margin-bottom:6px;font-weight:400;letter-spacing:1px;}
  #instructions p{font-size:14px;color:#ccc;}
  kbd{background:#222;border:1px solid #555;border-radius:4px;padding:1px 6px;font-size:12px;}
  #crosshair{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,0.7);z-index:10;pointer-events:none;}
  #hud{position:absolute;bottom:16px;left:16px;color:#fff;font-size:12px;background:rgba(0,0,0,0.45);padding:8px 12px;border-radius:6px;z-index:10;pointer-events:none;letter-spacing:0.5px;}
  #hud b{color:#f5f0e6;}

  /* ---- touch controls (mobile) ---- */
  #joystickZone,#lookZone{position:absolute;top:0;height:100%;z-index:15;touch-action:none;display:none;}
  #joystickZone{left:0;width:45%;}
  #lookZone{right:0;width:55%;}
  #joystickBase{position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.35);display:none;}
  #joystickKnob{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,0.55);top:50%;left:50%;pointer-events:none;}
  #mobileHint{position:absolute;bottom:14px;right:14px;color:rgba(255,255,255,0.55);font-size:11px;z-index:10;pointer-events:none;text-align:right;display:none;}

  @media (max-width:640px), (pointer:coarse){
    #instructions{max-width:88vw;padding:0 12px;}
    #galleryLogo{max-width:240px;}
    #gallerySubtitle{font-size:12px;}
    #instructions h2{font-size:18px;}
    #instructions p{font-size:13px;}
    #hud{font-size:11px;padding:6px 10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);}
    #crosshair{display:none;}
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   ARTWORK DATA
   -------------------------------------------------------------------------
   Add your real artwork here, keyed by frame number (1-68).
   Any id left out simply stays a numbered placeholder.
   "url" must be a direct, CORS-enabled image link (jpg/png/webp).
   "w" / "h" let you override the physical size of that one frame (meters).
   Example:
     3: { url: "https://example.com/my-painting.jpg", title: "Sunset Over the Bay",
          artist: "J. Rivera", year: "2023" },
   ========================================================================= */
const ARTWORK_DATA = {
  // 1: { url: "https://your-image-host.com/piece1.jpg", title: "Untitled I", artist: "Artist Name", year: "2024" },
};

/* ---------------- basic scene setup ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141414);
scene.fog = new THREE.Fog(0x141414, 25, 70);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);
camera.rotation.order = 'YXZ';
camera.position.set(4, 1.7, -3);

const renderer = new THREE.WebGLRenderer({ antialias:true });
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouchDevice ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------------- lighting ---------------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a2a, 0.7));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.4);
sun.position.set(10, 20, 5);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

/* ceiling light fixtures — glowing bars + downlight, one cluster per zone */
const fixtureMat = new THREE.MeshStandardMaterial({ color: 0xfffaf0, emissive: 0xfff0cf, emissiveIntensity: 1.3, roughness: 0.35 });
function addCeilingLight(x, z, length=3.2, depth=0.3, intensity=1.0, dist=11){
  const fixture = new THREE.Mesh(new THREE.BoxGeometry(length, 0.1, depth), fixtureMat);
  fixture.position.set(x, 4.88, z);
  scene.add(fixture);
  const light = new THREE.PointLight(0xfff2d9, intensity, dist, 1.7);
  light.position.set(x, 4.5, z);
  scene.add(light);
}
// Entrance Hall
addCeilingLight(7.5, 5, 7, 0.3, 0.9, 11);
// Rotunda (spread around the circle)
addCeilingLight(8, 20, 3, 0.3, 0.9, 10);
addCeilingLight(3, 30, 3, 0.3, 0.75, 9);
addCeilingLight(13, 30, 3, 0.3, 0.75, 9);
addCeilingLight(8, 35, 3, 0.3, 0.75, 9);
// Dark Gallery corridor
addCeilingLight(5, 50, 7, 0.3, 1.0, 12);
addCeilingLight(5, 60, 7, 0.3, 1.0, 12);
addCeilingLight(5, 70, 7, 0.3, 1.0, 12);
// Grand Hall
addCeilingLight(0, 88, 8, 0.3, 1.05, 14);
addCeilingLight(18, 88, 8, 0.3, 1.05, 14);
addCeilingLight(0, 102, 8, 0.3, 1.05, 14);
addCeilingLight(18, 102, 8, 0.3, 1.05, 14);

/* ---------------- floor ---------------- */
function makeFloorTexture(color1, color2){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color1; ctx.fillRect(0,0,128,128);
  ctx.strokeStyle = color2; ctx.lineWidth = 2;
  ctx.strokeRect(0,0,128,128);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const floorTex = makeFloorTexture('#cfc8ba', '#b9b0a0');
floorTex.repeat.set(40, 45);
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 });
const FOOTPRINT = { xMin: -11, xMax: 31, zMin: -6, zMax: 112 };
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(FOOTPRINT.xMax-FOOTPRINT.xMin, FOOTPRINT.zMax-FOOTPRINT.zMin),
  floorMat
);
floor.rotation.x = -Math.PI/2;
floor.position.set((FOOTPRINT.xMin+FOOTPRINT.xMax)/2, 0, (FOOTPRINT.zMin+FOOTPRINT.zMax)/2);
scene.add(floor);

/* ceiling */
const ceilMat = new THREE.MeshStandardMaterial({ color: 0xfaf8f2, roughness:1 });
const ceiling = new THREE.Mesh(floor.geometry.clone(), ceilMat);
ceiling.rotation.x = Math.PI/2;
ceiling.position.set(floor.position.x, 5, floor.position.z);
scene.add(ceiling);

/* ---------------- helpers: walls ---------------- */
const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f2ea, roughness: 0.95 });
function addWall(x1,z1,x2,z2,height=5,thickness=0.25){
  const len = Math.hypot(x2-x1, z2-z1);
  const geo = new THREE.BoxGeometry(len, height, thickness);
  const wall = new THREE.Mesh(geo, wallMat);
  wall.position.set((x1+x2)/2, height/2, (z1+z2)/2);
  wall.rotation.y = -Math.atan2(z2-z1, x2-x1);
  scene.add(wall);
}
// outer perimeter (with a gap for the main entrance on the south wall)
addWall(-11,-6, 6,-6); addWall(9,-6, 31,-6);       // south wall, gap x:6-9 = entrance
addWall(-11,112, 31,112);                          // north wall
addWall(-11,-6, -11,112);                          // west wall
addWall(31,-6, 31,112);                            // east wall
// low partition walls to separate the long gallery corridor
addWall(0,44, 0,76,5,0.2); addWall(10,44, 10,76,5,0.2);

/* ---------------- frame placeholder texture ---------------- */
const textureLoader = new THREE.TextureLoader();
textureLoader.crossOrigin = "anonymous";
function placeholderTexture(num){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#eae6db'; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle = '#b7b0a0'; ctx.lineWidth = 4; ctx.strokeRect(8,8,240,240);
  ctx.fillStyle = '#8d8674'; ctx.font = 'bold 74px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('#'+num, 128, 108);
  ctx.font = '17px Arial';
  ctx.fillText('artwork placeholder', 128, 170);
  return new THREE.CanvasTexture(c);
}

/* ---------------- frame factory ---------------- */
let frameCounter = 1;
const frameMeshes = [];
function createFrame(w=1.5, h=1.9){
  const id = frameCounter++;
  const data = ARTWORK_DATA[id];
  const group = new THREE.Group();
  group.userData.frameId = id;

  const border = new THREE.Mesh(
    new THREE.BoxGeometry(w+0.14, h+0.14, 0.07),
    new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6 })
  );
  group.add(border);

  const artMat = new THREE.MeshStandardMaterial({ map: placeholderTexture(id), roughness: 0.8 });
  const art = new THREE.Mesh(new THREE.PlaneGeometry(w, h), artMat);
  art.position.z = 0.04;
  group.add(art);

  if (data && data.url){
    const aw = data.w || w, ah = data.h || h;
    art.geometry = new THREE.PlaneGeometry(aw, ah);
    textureLoader.load(data.url, (tex) => { artMat.map = tex; artMat.needsUpdate = true; });
  }

  // small label plaque
  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 256; labelCanvas.height = 64;
  const lc = labelCanvas.getContext('2d');
  lc.fillStyle = '#f5f2ea'; lc.fillRect(0,0,256,64);
  lc.fillStyle = '#333'; lc.font = '20px Arial'; lc.textAlign='center';
  lc.fillText('#'+id + (data?.title ? ' · '+data.title : ''), 128, 28);
  lc.font = '14px Arial'; lc.fillStyle = '#666';
  lc.fillText(data?.artist || 'Artist TBD', 128, 48);
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  const label = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.125), new THREE.MeshBasicMaterial({ map: labelTex }));
  label.position.set(0, -h/2 - 0.16, 0.04);
  group.add(label);

  const light = new THREE.PointLight(0xfff2d9, 0.5, 4, 2);
  light.position.set(0, 0.9, 0.6);
  group.add(light);

  frameMeshes.push(group);
  return group;
}
function normalRotationY(nx, nz){ return Math.atan2(nx, nz); }

function placeFramesAlongX(xStart, xEnd, z, faceZDir, count, y=1.65, w, h){
  for(let i=0;i<count;i++){
    const t = (i+0.5)/count;
    const f = createFrame(w,h);
    f.position.set(xStart + (xEnd-xStart)*t, y, z);
    f.rotation.y = normalRotationY(0, faceZDir);
    scene.add(f);
  }
}
function placeFramesAlongZ(zStart, zEnd, x, faceXDir, count, y=1.65, w, h){
  for(let i=0;i<count;i++){
    const t = (i+0.5)/count;
    const f = createFrame(w,h);
    f.position.set(x, y, zStart + (zEnd-zStart)*t);
    f.rotation.y = normalRotationY(faceXDir, 0);
    scene.add(f);
  }
}
function placeFramesOnCircle(cx, cz, radius, count, y=1.65, w, h){
  for(let i=0;i<count;i++){
    const angle = (i/count) * Math.PI*2;
    const px = cx + radius*Math.cos(angle);
    const pz = cz + radius*Math.sin(angle);
    const f = createFrame(w,h);
    f.position.set(px, y, pz);
    const nx = cx-px, nz = cz-pz;
    f.rotation.y = normalRotationY(nx, nz);
    scene.add(f);
  }
}

/* ---------------- ROOM 1: Entrance Hall  (x 0-16, z 0-10) — 8 frames ---------------- */
placeFramesAlongX(1.5, 14.5, 9.8, -1, 8, 1.6, 1.3, 1.6);

/* ---------------- ROOM 2: Rotunda "印鉴馆" circle centered (8,27) r~8.5 — 16 frames -------- */
placeFramesOnCircle(8, 27, 8.3, 16, 1.6, 1.3, 1.7);

/* ---------------- ROOM 3: Dark Gallery corridor  x 0-10, z 44-76 — 20 frames -------- */
placeFramesAlongZ(46, 74, 0.15, 1, 10, 1.65, 1.4, 1.8);
placeFramesAlongZ(46, 74, 9.85, -1, 10, 1.65, 1.4, 1.8);

/* ---------------- ROOM 4: Grand Hall  x -11 to 31, z 80-112 — 24 frames -------- */
placeFramesAlongX(-8, 28, 111.8, -1, 8, 1.7, 1.6, 2.0);
placeFramesAlongX(-8, 28, 80.2, 1, 8, 1.7, 1.6, 2.0);
placeFramesAlongZ(83, 109, -10.85, 1, 4, 1.7, 1.6, 2.0);
placeFramesAlongZ(83, 109, 30.85, -1, 4, 1.7, 1.6, 2.0);

/* a couple of sculpture pedestals for large-format / 3D pieces in the grand hall */
function addPedestal(x,z){
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.9,1.0,0.9), new THREE.MeshStandardMaterial({color:0xe7e3d8}));
  p.position.set(x,0.5,z);
  scene.add(p);
}
addPedestal(4, 92); addPedestal(14, 92); addPedestal(9, 100);

/* room labels for HUD */
const ROOMS = [
  { name: 'Entrance Hall', zMin:-1, zMax:12 },
  { name: '印鉴馆 — Rotunda Gallery', zMin:12, zMax:42 },
  { name: '暗展廊 — Corridor Gallery', zMin:42, zMax:78 },
  { name: 'Grand Exhibition Hall', zMin:78, zMax:113 },
];
function currentRoom(z){
  for(const r of ROOMS) if (z>=r.zMin && z<r.zMax) return r.name;
  return '—';
}

/* =========================== CONTROLS =========================== */
/* Unified pointer-based controls: works identically with mouse (laptop
   trackpad/mouse) and touch (phone/tablet) via the Pointer Events API,
   so it doesn't depend on keyboard focus or native pointer-lock support
   (both of which can be unreliable inside embedded/iframe previews).
   Left half of the screen = virtual joystick to walk.
   Right half of the screen = drag to look around.
   WASD + mouse-look still work as a bonus on desktop when available. */

const blocker = document.getElementById('blocker');
const roomNameEl = document.getElementById('roomName');
const instructionsBody = document.getElementById('instructionsBody');

instructionsBody.innerHTML =
  'Click / tap to start<br>' +
  'Left side of screen — drag to walk<br>' +
  'Right side of screen — drag to look around<br>' +
  '<span style="opacity:0.7">(desktop: WASD + mouse also work)</span>';

let pitch = 0;
const keys = {};
let started = false;

function startExperience(){
  if (started) return;
  started = true;
  blocker.style.display = 'none';
  document.getElementById('joystickZone').style.display = 'block';
  document.getElementById('lookZone').style.display = 'block';
  document.getElementById('mobileHint').style.display = 'block';
  setTimeout(() => { document.getElementById('mobileHint').style.display = 'none'; }, 4000);
  // best-effort pointer lock for a nicer desktop mouse-look; ignored if unsupported/blocked
  if (document.body.requestPointerLock){
    const p = document.body.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  }
}
blocker.addEventListener('click', startExperience);

document.addEventListener('keydown', (e) => keys[e.code] = true);
document.addEventListener('keyup', (e) => keys[e.code] = false);

/* optional native pointer-lock mouse-look (desktop only, bonus on top of drag-look) */
document.addEventListener('mousemove', (e) => {
  if (!started) return;
  if (document.pointerLockElement !== document.body) return;
  camera.rotation.y -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
  camera.rotation.x = pitch;
});

/* ---- virtual joystick (movement) — pointer events = mouse + touch ---- */
const joystickVector = { x: 0, z: 0 }; // x = strafe, z = forward, both -1..1
let joyPointerId = null;
const joystickZone = document.getElementById('joystickZone');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
const JOY_RADIUS = 50;

function joyStart(e){
  joyPointerId = e.pointerId;
  joystickZone.setPointerCapture(e.pointerId);
  const rect = joystickZone.getBoundingClientRect();
  joystickBase.style.display = 'block';
  joystickBase.style.left = (e.clientX - rect.left - JOY_RADIUS) + 'px';
  joystickBase.style.top = (e.clientY - rect.top - JOY_RADIUS) + 'px';
  joystickBase.dataset.cx = e.clientX;
  joystickBase.dataset.cy = e.clientY;
}
function joyMove(e){
  const cx = parseFloat(joystickBase.dataset.cx), cy = parseFloat(joystickBase.dataset.cy);
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const dist = Math.hypot(dx,dy);
  if (dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
  joystickKnob.style.left = (50 + dx) + 'px';
  joystickKnob.style.top = (50 + dy) + 'px';
  joystickVector.x = dx / JOY_RADIUS;
  joystickVector.z = -dy / JOY_RADIUS;
}
function joyEnd(){
  joyPointerId = null;
  joystickVector.x = 0; joystickVector.z = 0;
  joystickBase.style.display = 'none';
  joystickKnob.style.left = '50%'; joystickKnob.style.top = '50%';
}
joystickZone.addEventListener('pointerdown', (e) => { e.preventDefault(); if (joyPointerId===null) joyStart(e); });
joystickZone.addEventListener('pointermove', (e) => { if (e.pointerId===joyPointerId) joyMove(e); });
joystickZone.addEventListener('pointerup', (e) => { if (e.pointerId===joyPointerId) joyEnd(); });
joystickZone.addEventListener('pointercancel', joyEnd);

/* ---- look pad (right side drag to rotate camera) — pointer events ---- */
const lookZone = document.getElementById('lookZone');
let lookPointerId = null, lastLookX = 0, lastLookY = 0;
lookZone.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (lookPointerId !== null) return;
  lookPointerId = e.pointerId;
  lookZone.setPointerCapture(e.pointerId);
  lastLookX = e.clientX; lastLookY = e.clientY;
});
lookZone.addEventListener('pointermove', (e) => {
  if (e.pointerId !== lookPointerId) return;
  const dx = e.clientX - lastLookX, dy = e.clientY - lastLookY;
  lastLookX = e.clientX; lastLookY = e.clientY;
  camera.rotation.y -= dx * 0.0045;
  pitch -= dy * 0.0045;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
  camera.rotation.x = pitch;
});
lookZone.addEventListener('pointerup', (e) => { if (e.pointerId===lookPointerId) lookPointerId = null; });
lookZone.addEventListener('pointercancel', () => { lookPointerId = null; });

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  const kbForward = (keys['KeyW']||keys['ArrowUp']?1:0) - (keys['KeyS']||keys['ArrowDown']?1:0);
  const kbStrafe  = (keys['KeyD']||keys['ArrowRight']?1:0) - (keys['KeyA']||keys['ArrowLeft']?1:0);
  const usingKeyboard = kbForward !== 0 || kbStrafe !== 0;

  let forward, strafe, speed;
  if (usingKeyboard){
    forward = kbForward; strafe = kbStrafe;
    speed = (keys['ShiftLeft']||keys['ShiftRight']) ? 6.5 : 3.4;
  } else {
    forward = joystickVector.z; strafe = joystickVector.x;
    speed = 3.6;
  }

  if (forward || strafe){
    const yaw = camera.rotation.y;
    const dirX = Math.sin(yaw)*forward + Math.cos(yaw)*strafe;
    const dirZ = Math.cos(yaw)*forward - Math.sin(yaw)*strafe;
    const len = Math.hypot(dirX,dirZ) || 1;
    const mag = Math.min(1, Math.hypot(forward,strafe));
    camera.position.x += (dirX/len) * speed * mag * delta;
    camera.position.z += (dirZ/len) * speed * mag * delta;
  }

  camera.position.x = Math.max(FOOTPRINT.xMin+0.4, Math.min(FOOTPRINT.xMax-0.4, camera.position.x));
  camera.position.z = Math.max(FOOTPRINT.zMin+0.4, Math.min(FOOTPRINT.zMax-0.4, camera.position.z));
  camera.position.y = 1.7;

  roomNameEl.textContent = currentRoom(camera.position.z);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
